# Vercel has no always-on process, so this wakes the post office every 5 minutes
# to send letters whose moment has come. Needs two repository secrets:
#   TICK_URL     https://<your-site>/api/tick
#   CRON_SECRET  the same value as CRON_SECRET in the Vercel project
name: Post round
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: post-round
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send letters that are due
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$TICK_URL" ]; then echo "TICK_URL secret is not set"; exit 1; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$TICK_URL"
